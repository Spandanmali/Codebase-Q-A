[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-qna"
version = "0.1.0"
description = "A local-first codebase question and answer foundation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pathspec>=0.12,<1.0",
    "psutil>=5.9",
    "chromadb>=1.0,<2.0",
    "tree-sitter>=0.22,<1.0",
    "tree-sitter-python>=0.21,<1.0",
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
